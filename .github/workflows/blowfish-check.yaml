name: Check Blowfish build

on:
  push:
    branches:
      - modernize-blowfish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: 1.27.0
      HUGO_VERSION: 0.166.0
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Hugo
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Resolve Hugo modules
        run: hugo mod get -u

      - name: Build site
        run: hugo --gc --minify --destination public-preview

      - name: Upload preview artifact
        uses: actions/upload-artifact@v6
        with:
          name: blowfish-preview
          path: public-preview
          if-no-files-found: error
