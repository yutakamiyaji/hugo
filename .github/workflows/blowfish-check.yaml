name: Check Blowfish build

on:
  push:
    branches:
      - modernize-blowfish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: 1.27.0
      HUGO_VERSION: 0.166.0
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Hugo
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Resolve Hugo modules
        run: hugo mod get -u

      - name: Build site
        run: hugo --gc --minify --destination public-preview

      - name: Build offline browser preview
        run: |
          HUGO_RELATIVEURLS=true HUGO_BASEURL="https://preview.local/" hugo --gc --minify --destination browser-preview
          cat > browser-preview/OPEN-ME.txt <<'EOF'
          MyjLab Blowfish Preview
          =======================

          1. Extract this ZIP.
          2. Double-click index.html.
          3. This preview does not change the live www.myjlab.org site.

          Note: Some browser security features may limit search when opened as file://.
          EOF

      - name: Upload browser preview
        uses: actions/upload-artifact@v6
        with:
          name: myjlab-blowfish-browser-preview
          path: browser-preview
          if-no-files-found: error
          retention-days: 14
