baseURL = "https://www.myjlab.org/"
title = "MyjLab"
languageCode = "ja"
defaultContentLanguage = "ja"
enableRobotsTXT = true
summaryLength = 30

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[permalinks]
  blog = "/blog/:year/:month/:day/:contentbasename/"

[caches]
  [caches.images]
    dir = ":cacheDir/images"
